name: CI Pipelines

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on:  ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install ci
      
      - name: Build
        run: npm run build
      
      - name: run
        run: npm run lint